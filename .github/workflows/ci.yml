name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow dispatches CI on the release pull request's branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    name: Audit (RustSec advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    name: Docker build and smoke test (no push)
    # Only release pull requests: the image is only published from them.
    if: github.ref_name == 'changeset-release/main' || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: localmail:smoke
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      # Start it the way the README shows and send over SMTP and an API.
      - run: scripts/docker-smoke.sh localmail:smoke

  changeset:
    name: Changeset present
    # The release pull request consumes changesets rather than adding one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for a changeset
        run: |
          if ! npx changeset status --since="origin/${{ github.base_ref }}"; then
            echo "::error::This pull request needs a changeset. Run 'npm run changeset' (or 'npm run changeset -- --empty' for changes users won't notice)."
            exit 1
          fi
